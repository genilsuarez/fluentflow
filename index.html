    <style>
      .skip-link {
        position: absolute;
        left: -9999px;
        top: 16px;
        z-index: 10000;
        padding: 10px 18px;
        background: #3b82f6;
        color: #fff;
        font-weight: 700;
        font-size: 0.8rem;
        border-radius: 10px;
        text-decoration: none;
      }
      .skip-link:focus {
        left: 16px;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#root">Saltar al contenido</a>
    <div id="root"></div>
    <!-- Offline/load-failure fallback (hidden when React mounts) -->
    <div
      id="app-fallback"
      hidden
      aria-hidden="true"
      style="display: none; padding: 2rem; text-align: center; font-family: system-ui, sans-serif"
    >
      <p style="font-size: 1.125rem; margin-bottom: 1rem; color: #374151">
        Loading failed — please check your connection.
      </p>
      <button
        onclick="window.location.reload()"
        style="
          padding: 0.625rem 1.5rem;
          font-size: 1rem;
          background: #3b82f6;
          color: #fff;
          border: none;
          border-radius: 0.5rem;
          cursor: pointer;
        "
      >
        Reload
      </button>
    </div>
    <!-- Theme initialization - prevents FOUC -->
    <script>
      (function () {
        try {
          var navigationMode = localStorage.getItem('lp-navigation-mode');
          document.documentElement.dataset.navigationMode =
            navigationMode === 'floating' ? 'floating' : 'sidebar';
          var theme = 'light';
          // 1. URL query param (cross-app theme propagation in local dev)
          var urlTheme = new URLSearchParams(window.location.search).get('theme');
          if (urlTheme === 'dark' || urlTheme === 'light') {
            theme = urlTheme;
            localStorage.setItem('lp-theme', urlTheme);
          } else {
            // 2. Shared cross-app key
            var sharedTheme = localStorage.getItem('lp-theme');
            if (sharedTheme === 'dark' || sharedTheme === 'light') {
              theme = sharedTheme;
            } else {
              // 3. Zustand persisted settings (fallback)
              var stored = localStorage.getItem('settings-storage');
              if (stored) {
                var parsed = JSON.parse(stored);
                if (parsed.state && parsed.state.theme) theme = parsed.state.theme;
              }
            }
          }
          document.documentElement.classList.add(theme);
          document.documentElement.classList.remove(theme === 'dark' ? 'light' : 'dark');
          document.documentElement.style.colorScheme = theme;
          localStorage.setItem('lp-theme', theme);
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#181b20' : '#ffffff');
          var colorSchemeMeta = document.querySelector('meta[name="color-scheme"]');
          if (colorSchemeMeta) colorSchemeMeta.setAttribute('content', theme);
          // Apply dark theme to fallback if needed
          if (theme === 'dark') {
            document.documentElement.style.backgroundColor = '#181b20';
            var fb = document.getElementById('app-fallback');
            if (fb) {
              fb.style.background = '#181b20';
              fb.querySelector('p').style.color = '#a8b0bc';
            }
          }
        } catch (e) {
          document.documentElement.classList.add('light');
        }
        // Safari iOS: reload when page is restored from bfcache — but never during
        // OAuth return (tokens in URL) or when React is already alive.
        window.addEventListener('pageshow', function (e) {
          if (!e.persisted || navigator.onLine === false) return;
          var href = window.location.href;
          if (/(^|[#?&])(access_token|refresh_token|code|error_description)=/.test(href)) return;
          if (window.__REACT_ALIVE) return;
          window.location.reload();
        });
        // Catch stale chunk errors from static imports (not covered by lazyWithRetry).
        // After a deploy, iOS Safari may serve stale HTML referencing old JS chunks
        // that no longer exist. Detect this and force a single reload.
        window.addEventListener('error', function (e) {
          if (
            e.message &&
            (e.message.indexOf('Failed to fetch') !== -1 ||
              e.message.indexOf('Loading chunk') !== -1 ||
              e.message.indexOf('Loading CSS chunk') !== -1 ||
              e.message.indexOf('dynamically imported module') !== -1)
          ) {
            if (!sessionStorage.getItem('static-chunk-retry')) {
              sessionStorage.setItem('static-chunk-retry', '1');
              window.location.reload();
            }
          }
        });
        window.addEventListener('unhandledrejection', function (e) {
          var msg = e.reason && e.reason.message ? e.reason.message : '';
          if (
            msg.indexOf('Failed to fetch') !== -1 ||
            msg.indexOf('Loading chunk') !== -1 ||
            msg.indexOf('dynamically imported module') !== -1
          ) {
            if (!sessionStorage.getItem('static-chunk-retry')) {
              sessionStorage.setItem('static-chunk-retry', '1');
              window.location.reload();
            }
          }
        });
        // Detect frozen/discarded page resume (Safari iOS tab suspension)
        var lastActive = Date.now();
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) {
            var elapsed = Date.now() - lastActive;
            var root = document.getElementById('root');
            var href = window.location.href;
            if (/(^|[#?&])(access_token|refresh_token|code|error_description)=/.test(href)) {
              lastActive = Date.now();
              return;
            }
            // Only reload a truly frozen tab — not a slow Vite cold start
            if (elapsed > 60000 && root && !root.firstChild && !window.__REACT_ALIVE) {
              if (navigator.onLine !== false) {
                window.location.reload();
              }
            }
          }
          lastActive = Date.now();
        });
        function hideAppFallback() {
          var fb = document.getElementById('app-fallback');
          if (fb) {
            fb.hidden = true;
            fb.style.display = 'none';
            fb.setAttribute('aria-hidden', 'true');
          }
        }
        window.__hideAppFallback = hideAppFallback;

        var rootEl = document.getElementById('root');
        if (rootEl) {
          var rootObserver = new MutationObserver(function () {
            if (rootEl.firstChild) {
              window.__REACT_ALIVE = true;
              hideAppFallback();
            }
          });
          rootObserver.observe(rootEl, { childList: true });
        }

        // Show fallback only if React never mounts (slow network / chunk error)
        setTimeout(function () {
          if (window.__REACT_ALIVE) return;
          if (rootEl && rootEl.firstChild) return;
          var fb = document.getElementById('app-fallback');
          if (fb) {
            fb.hidden = false;
            fb.style.display = 'block';
            fb.setAttribute('aria-hidden', 'false');
          }
        }, 15000);
      })();
    </script>
    <script src="lp-guest-reset.js"></script>

    <script src="lp-login-nudge.js"></script>
    <script type="module" src="./src/main.tsx"></script>
