name: Maintenance - Refresh Artifacts

# Run every 5 days to keep CI/CD artifacts fresh (GitHub expires them at 7 days)
on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maintenance-refresh
  cancel-in-progress: false

jobs:
  refresh-artifacts:
    name: Refresh CI/CD Artifacts
    runs-on: ubuntu-latest
    # Guard: only run on schedule or manual dispatch. Prevents ghost runs that
    # GitHub creates when this file is modified in a push (which would show as
    # "No jobs were run" failures and send noisy emails).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      commit-sha: ${{ steps.commit.outputs.sha }}
      status: ${{ steps.commit.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # PAT from repo owner — needed to bypass branch protection on main.
          # Falls back to GITHUB_TOKEN if MAINTENANCE_PAT is not set (push
          # will then fail with a clear "protected branch hook declined"
          # message in the job summary instead of silently skipping).
          token: ${{ secrets.MAINTENANCE_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          # Use repo owner identity so the commit matches the PAT and
          # passes branch protection (if configured to allow admin bypass).
          git config user.name "genilsuarez"
          git config user.email "genilsuarez@users.noreply.github.com"

      - name: Create maintenance commit
        id: commit
        run: |
          # Abort if working tree dirty (should not happen after fresh checkout)
          if ! git diff-index --quiet HEAD --; then
            echo "::warning::Uncommitted changes detected, skipping maintenance commit"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit --allow-empty -m "chore(maintenance): refresh build artifacts

          Automated commit to keep CI/CD artifacts within the 7-day retention window.
          Triggered by: ${{ github.event_name }}
          Run: ${{ github.run_id }}"

          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "status=created" >> "$GITHUB_OUTPUT"
          echo "Created empty commit $SHA"

      - name: Push commit
        if: steps.commit.outputs.status == 'created'
        run: |
          # Retry push if remote advanced during run
          if ! git push; then
            echo "Push rejected, pulling with rebase and retrying..."
            git pull --rebase
            git push
          fi
          echo "Pushed ${{ steps.commit.outputs.sha }} to ${{ github.ref_name }}"

      - name: Job summary
        if: always()
        env:
          HAS_PAT: ${{ secrets.MAINTENANCE_PAT != '' && 'yes' || 'no' }}
        run: |
          {
            echo "# Maintenance Run"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Status | \`${{ steps.commit.outputs.status || 'failed' }}\` |"
            echo "| Commit | \`${{ steps.commit.outputs.sha || 'n/a' }}\` |"
            echo "| PAT configured | \`$HAS_PAT\` |"
            echo "| Next run | ~5 days (cron \`0 0 */5 * *\`) |"
            echo ""
            echo "## Purpose"
            echo "Creates an empty commit to trigger CI Build, regenerating artifacts that GitHub"
            echo "expires after 7 days. Without this, CD Deploy cannot find artifacts for deploy."
            echo ""
            if [ "$HAS_PAT" = "no" ]; then
              echo "## ⚠️ Missing PAT"
              echo "\`MAINTENANCE_PAT\` secret is not set. Pushes to protected branches will fail."
              echo "See: Settings → Secrets and variables → Actions → New repository secret."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
