name: CI Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci --prefer-offline --no-audit

      # Run all checks in parallel via background processes
      - name: Quality checks (parallel)
        run: |
          npm run lint        &  PID_LINT=$!
          npm run type-check  &  PID_TYPE=$!
          npm test            &  PID_TEST=$!
          npm run format:check & PID_FMT=$!
          npm run validate:breakpoints & PID_BP=$!
          # Pruebas de progreso: cada caso corresponde a un bug que llegó a
          # producción con totales o completados incorrectos.
          # docs/progress-counting-system.md
          #
          # Recorre tests/*.mjs en vez de nombrar el archivo: con la lista a mano
          # cada prueba nueva queda fuera de CI en silencio (le pasó a DeskFlow,
          # donde el gate local corría cuatro suites y CI solo una).
          (shopt -s nullglob; rc=0; for t in tests/*.mjs; do echo "── $t"; node "$t" || rc=1; done; exit $rc) & PID_PROG=$!

          FAIL=0
          wait $PID_LINT   || { echo "❌ ESLint failed";      FAIL=1; }
          wait $PID_TYPE   || { echo "❌ TypeScript failed";  FAIL=1; }
          wait $PID_TEST   || { echo "❌ Tests failed";       FAIL=1; }
          wait $PID_FMT    || { echo "❌ Format check failed"; FAIL=1; }
          wait $PID_BP     || { echo "❌ Breakpoint check failed"; FAIL=1; }
          wait $PID_PROG   || { echo "❌ Progress invariants failed"; FAIL=1; }

          [ $FAIL -eq 0 ] && echo "✅ All quality checks passed"
          exit $FAIL
